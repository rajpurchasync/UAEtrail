# ── UAE Trail — Nginx reverse-proxy + SPA server ────────────────────────────
#
# • Serves the Vite SPA from /usr/share/nginx/html
# • Proxies /api/* and /health to the backend API container
# • SPA fallback: all other routes → index.html (React Router)
# • Optional TLS: uncomment the ssl server block and mount certs
# ────────────────────────────────────────────────────────────────────────────

upstream api_backend {
    server api:4000;
}

server {
    listen 80;
    server_name _;

    # ── Security headers ────────────────────────────────────────────────
    include /etc/nginx/snippets/security-headers.conf;

    # ── Gzip ────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # ── API proxy ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health/ready {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Digital Asset Links / Universal Links ───────────────────────────
    location /.well-known/ {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # ── Static assets (long cache) ─────────────────────────────────────
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ───────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

