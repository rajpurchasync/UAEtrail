# Retired consumer hubs — 301 before SPA fallback (see inboundBookmarkPaths.ts).
# Preserves query strings; notification deep links may still normalize in-app.

location ~ ^/trips/map/?$ {
    return 301 /profile/history/map$is_args$args;
}

location ~ ^/trips/?$ {
    return 301 /plan$is_args$args;
}

location ~ ^/community/?$ {
    return 301 /explore$is_args$args;
}
