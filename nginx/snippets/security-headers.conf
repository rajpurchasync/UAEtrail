# Shared security headers (included by HTTP and HTTPS server blocks)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://accounts.google.com https://*.stripe.com wss: ws:; frame-src https://accounts.google.com https://js.stripe.com https://hooks.stripe.com https://www.openstreetmap.org https://openstreetmap.org; worker-src 'self'; manifest-src 'self';" always;
