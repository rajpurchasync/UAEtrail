# Stale consumer pathnames — 301 before SPA fallback (see inboundBookmarkPaths.ts).
# Preserves query strings; notification deep links normalize in-app.

location ~ ^/trips/map/?$ {
    return 301 /profile/history/map$is_args$args;
}

location ~ ^/trips/?$ {
    return 301 /plan$is_args$args;
}

location ~ ^/profile/my-trips/map/?$ {
    return 301 /profile/history/map$is_args$args;
}

location ~ ^/profile/my-trips/?$ {
    return 301 /profile/history$is_args$args;
}

location ~ ^/community/?$ {
    return 301 /explore$is_args$args;
}

location = /map {
    return 301 /explore$is_args$args;
}

location = /discovery {
    return 301 /explore$is_args$args;
}

location = /buddies {
    return 301 /crews$is_args$args;
}

location = /contributions {
    return 301 /profile/submissions$is_args$args;
}

location = /messages {
    return 301 /chat$is_args$args;
}

location = /become-host {
    return 301 /profile/pro-membership$is_args$args;
}

location = /become-organizer {
    return 301 /profile/pro-membership$is_args$args;
}

location ~ ^/notifications(/.*)?$ {
    return 301 /settings/notifications$1$is_args$args;
}

location ~ ^/profile/settings(/.*)?$ {
    return 301 /settings$1$is_args$args;
}

location = /rewards {
    return 301 /profile/badges$is_args$args;
}

location = /my-rewards {
    return 301 /profile/badges$is_args$args;
}

location = /trail-points {
    return 301 /profile/badges$is_args$args;
}

location = /profile/wishlist {
    return 301 /plan?view=plans&tab=wishlist$is_args$args;
}