name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb+srv://uaetrail:uaetrail%40365@cluster0.ymapl3i.mongodb.net/?appName=Cluster0
      JWT_ACCESS_SECRET: ci-test-access-secret-min-24-chars
      JWT_REFRESH_SECRET: ci-test-refresh-secret-min-24-chars
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: API typecheck
        run: npm run typecheck:api

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build API
        run: npm run build:api

      - name: API tests
        run: npm run test:api

      - name: Frontend tests
        run: npm run test:frontend

  docker-build:
    runs-on: ubuntu-latest
    env:
      S3_ACCESS_KEY_ID: ci-test-key
      S3_SECRET_ACCESS_KEY: ci-test-secret-min8
      JWT_ACCESS_SECRET: ci-test-access-secret-min-24-chars
      JWT_REFRESH_SECRET: ci-test-refresh-secret-min-24-chars
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker compose build api
