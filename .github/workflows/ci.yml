name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uaetrail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uaetrail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/uaetrail_test?schema=public
      JWT_ACCESS_SECRET: ci-test-access-secret-min-24-chars
      JWT_REFRESH_SECRET: ci-test-refresh-secret-min-24-chars
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Frontend typecheck
        run: npm run typecheck

      - name: API typecheck
        run: npm run typecheck:api

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build API
        run: npm run build:api

      - name: API tests
        run: npm run test:api

      - name: Frontend tests
        run: npm run test:frontend
