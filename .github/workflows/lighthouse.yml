# Lighthouse CI on PRs for detail routes (/activity/demo, /place/demo via vite preview).
# Plan §15.1 targets are warn-first in scripts/governance/lighthouse-detail.config.json — noisy scores must not fail the PR.
# This job fails only if Chrome, vite preview, or @lhci/cli crashes (or tools are missing on the runner).
# Do not add this to npm run verify:system:quick (that gate is bundle-graph via verify:perf).
name: Lighthouse detail

on:
  pull_request:
    branches: [main]

jobs:
  lighthouse-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_CONFIG_DEVDIR: ''

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Lighthouse CI (warn assertions)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run lighthouse:detail

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-detail
          path: .lighthouseci
          if-no-files-found: ignore
